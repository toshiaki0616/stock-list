name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reject committed secret files
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .env ] || [ -f .env.production ] || [ -f .env.local ]; then
            echo 'Real environment files must not be committed.'
            exit 1
          fi

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find api -type f -name '*.js' -print0)

      - name: JSON syntax check
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"

      - name: SQL migration note
        run: echo 'SQL is not applied in CI; PR must document apply and rollback steps when SQL changes.'
